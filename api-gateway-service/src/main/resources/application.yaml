
spring:
  application:
    name: api-gateway-service

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/users/**
              filters:
                - name: JwtAuthFilter

            - id: market-data-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/market/**
              filters:
                - name: JwtAuthFilter

            - id: market-websocket
              uri: ws://localhost:8082
              predicates:
                - Path=/ws/**

            - id: order-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/orders/**
              filters:
                - name: JwtAuthFilter

            - id: portfolio-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/portfolio/**
              filters:
                - name: JwtAuthFilter

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"

server:
  port: 8080

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway

